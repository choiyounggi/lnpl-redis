[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lnpl-redis"
version = "0.1.0"
description = "Redis CacheDriver for lnpl (linkly#143)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "lnpl>=0.9,<0.10",
    "redis>=8,<9",
]

[project.optional-dependencies]
test = ["testcontainers[redis]>=4.15,<5", "packaging>=24"]

[project.entry-points."lnpl.caches"]
redis = "lnpl_redis:make_cache"

[tool.setuptools]
packages = ["lnpl_redis"]
